<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>

  <link rel="preload" href="assets/fonts/outfit-v15-latin-regular.woff2" as="font" type="font/woff2" crossorigin="anonymous">
  <link rel="preload" href="assets/fonts/outfit-v15-latin-700.woff2" as="font" type="font/woff2" crossorigin="anonymous">

  <link rel="stylesheet" href="styles/style.css">

</head>
<body>

  <main>
    <article class="card" aria-labelledby="card-title">
      <img class="card__img" src="assets/images/image-qr-code.png" alt="QR code linking to the Frontend Mentor website" width="576" height="576">
      <div class="card__text-container">
        <h1 id="card-title" class="card__title">Improve your front-end skills by building projects</h1>
        <p class="card__description">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
      </div>
    </article>
  </main>
  
</body>
</html>
